name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 20.19.x
          - 22.x

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Verify repository
      run: npm run verify:repository

    - name: Build internal packages
      run: npm run editvcs:build:packages

    - name: Lint check
      run: npm run editvcs:lint

    - name: Build all packages
      run: npm run editvcs:build

    - name: Run Tests
      run: npm run editvcs:test

    - name: Package CEP panel (unsigned)
      run: npm run package:cep:unsigned

    - name: Run Companion Smoke Test
      run: node scripts/companion-smoke-test.js

    - name: Upload unsigned CEP developer package
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: EditVCS-CEP-unsigned-${{ github.sha }}
        path: release/EditVCS-CEP-unsigned.zip
        if-no-files-found: error
        retention-days: 14
